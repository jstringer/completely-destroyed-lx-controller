name: release

# This repo is ONLY the app: it normally lives at <nap-sdk>/apps/lxcontrol and every build path reaches
# outside it (../../thirdparty/python, ../../tools/buildsystem). So the runner has to reconstruct that
# layout first: fetch the prebuilt NAP SDK, then drop this checkout into its apps/ directory.
#
# The prebuilt SDK is fully self-contained -- including Vulkan at
# system_modules/naprender/thirdparty/vulkansdk -- so no separate Vulkan install is needed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without the leading v)'
        required: true
      publish:
        description: 'Publish instead of leaving a draft'
        type: boolean
        default: false

permissions:
  contents: write        # required to create/upload releases

env:
  NAP_VERSION: 0.8.0
  NAP_ARCHIVE: NAP-0.8.0-Win64-x86_64.zip
  # NAP's get_visual_studio_generator() cannot detect the toolchain on a bare runner and falls back to
  # "Visual Studio 16 2019", which is not installed -- cmake generate then fails. get_system_generator()
  # checks CMAKE_GENERATOR first, so state it explicitly rather than relying on detection or on wrapping
  # the step in a VS developer shell.
  CMAKE_GENERATOR: Visual Studio 17 2022
  # Extract to a SHORT root on the SAME VOLUME as the workspace (D: on the Windows runners). Short
  # because NAP's tree is deep and MSVC still trips over MAX_PATH inside the default
  # D:\a\<repo>\<repo> workspace; same volume so moving the checkout in is a rename rather than the
  # cross-volume copy+delete that failed on .git's hidden/system attributes.
  NAP_ROOT: D:\nap

jobs:
  windows:
    # Pinned, not windows-latest: on the current latest image NAP's bundled cmake reports "could not
    # find any instance of Visual Studio" for the 17 2022 generator. Pinning keeps releases
    # reproducible, and fails loudly if the image is ever retired.
    runs-on: windows-2022
    steps:
      - name: Keep line endings as committed
        # The runner defaults core.autocrlf to true; this repo is LF, so checkout would rewrite every
        # file and release.py's clean-tree check would refuse to build.
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0        # release.py reads the commit for the artifact name

      - name: Cache the NAP SDK archive
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NAP_ROOT }}\${{ env.NAP_ARCHIVE }}
          key: nap-sdk-${{ env.NAP_VERSION }}-win64

      - name: Download the NAP SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:NAP_ROOT | Out-Null
          $url = "https://github.com/napframework/nap/releases/download/v$env:NAP_VERSION/$env:NAP_ARCHIVE"
          Write-Host "Fetching $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:NAP_ROOT\$env:NAP_ARCHIVE"

      - name: Unpack the SDK and place the app inside it
        shell: pwsh
        run: |
          Expand-Archive -Path "$env:NAP_ROOT\$env:NAP_ARCHIVE" -DestinationPath $env:NAP_ROOT -Force
          $sdk = Join-Path $env:NAP_ROOT "NAP-$env:NAP_VERSION-Win64-x86_64"
          if (-not (Test-Path $sdk)) { throw "SDK not found at $sdk after extraction" }
          $dest = Join-Path $sdk "apps\lxcontrol"
          # robocopy rather than Move-Item: it moves hidden/system/read-only files (.git) correctly and
          # does not care whether source and destination share a volume. Exit codes below 8 are success.
          robocopy "app" "$dest" /E /MOVE /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          if (-not (Test-Path (Join-Path $dest "app.json"))) { throw "app.json missing at $dest" }
          "APP_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "app is now at $dest"

      - name: Report the available toolchain
        # In-run evidence: a toolchain mismatch here should not need another run to diagnose.
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -products * -format value -property catalog_productDisplayVersion
            & $vswhere -products * -format value -property installationPath
          } else {
            Write-Host "no vswhere at $vswhere"
          }
          Write-Host "CMAKE_GENERATOR=$env:CMAKE_GENERATOR"

      - name: Build, package and release
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag pushes release the tag's version and publish; manual runs use the supplied version and
          # default to a draft so a dry run cannot mint a release by accident.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
            $publish = '--publish'
          } else {
            $version = '${{ inputs.version }}'
            $publish = if ('${{ inputs.publish }}' -eq 'true') { '--publish' } else { '' }
          }
          Write-Host "Releasing version $version $publish"
          python scripts/release.py --version $version $publish

      - name: Keep the artifact even if the release step failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lxcontrol-win64
          path: ${{ env.APP_DIR }}\lxcontrol-*.zip
          if-no-files-found: warn
